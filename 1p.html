<html>
<header>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
</header>
<style>
    body {
        background-color: lightgreen;
    }

    .c {
        font-size: 75px;
        cursor: grab;
        line-height: 1.2;
        color: black;
        background-color: lightblue;
    }
    button:disabled {
        cursor: not-allowed;
        background-color: lightgrey;
    }
</style>

<body>
    <h1>Video Poker</h1>
    <p>(or 1 player poker)</p>
    <label>You have: $<span id="money"></span> </label><button onClick="reset()">Reset money.</button>
    <br><br>
    <p>How much? Bet min is $2. Bet max is $500</p>
    <input type="number" id="bet"></p>
    <button onClick="placeBet()" id="bb">Bet</button>
    <p id="status"></p>
    <label>Your Hand:</label>
    <div id="yourHand">
        <button class="c" id="c0" onClick="select(0)">🂠</button>
        <button class="c" id="c1" onClick="select(1)">🂠</button>
        <button class="c" id="c2" onClick="select(2)">🂠</button>
        <button class="c" id="c3" onClick="select(3)">🂠</button>
        <button class="c" id="c4" onClick="select(4)">🂠</button>
    </div>
    <button id="disc" onClick="discard()">Discard</button>
</body>

    let dCards = [];

    document.getElementById("money").innerHTML = money;
    document.getElementById("bb").disabled = false;
    switchButtons(true);

    function switchButtons(on) {
        const buttons = document.getElementsByClassName("c");
        for (let button of buttons) {
            button.disabled = on
        }
    }
    function placeBet() {
        bet = Number(document.getElementById("bet").value)
        if ((bet <= 1) || (bet > 500) || (bet > money)) {
            document.getElementById("status").innerHTML = "Bet invalid. Try again."
            if (bet > money) {
                document.getElementById("status").innerHTML = "You don't have enough money."
            }
            return;
        }
        document.getElementById("status").innerHTML = "Your bet: " + bet;
        drawHand();
        document.getElementById("bb").disabled = true;
        switchButtons(false);
    }
    function drawHand() {
        deck = [
            {card: '🂡 ', point: 1},
            {card: '🃑 ', point: 1},

            {card: '🂮 ', point: 13},
            {card: '🂾 ', point: 13},
            {card: '🃎 ', point: 13},
            {card: '🃞 ', point: 13}];

        drawCards();
        drawCards();
        drawCards();
        drawCards();
        drawCards();
        updateHand();
    }
    function drawCards() {
        let randomCard = Math.floor(Math.random() * deck.length);
        yourHand.push(deck[randomCard]);
        deck.splice(randomCard, 1);
    }
    function select(No) {
        if (dCards.includes(No)) {
            const index = dCards.indexOf(No);
            if (index !== -1) {
                dCards.splice(index, 1);
            }
            document.getElementById("c" + No).style.backgroundColor = "lightgreen";
        }
        else {
            dCards.push(No);
            document.getElementById("c" + No).style.backgroundColor = "yellow";
        }
    }
    function discard() {
        const targets = dCards.sort((a, b) => b - a);
        targets.forEach(index => {
            yourHand.splice(index, 1);
        });
        targets.forEach(index => {
            drawCards();
        })
        updateHand();
        switchButtons(true);
        document.getElementById("disc").disabled = true;
        checkWin();
    }
    function updateHand() {
        document.getElementById("c0").innerHTML = yourHand[0].card;
        document.getElementById("c1").innerHTML = yourHand[1].card;
        document.getElementById("c2").innerHTML = yourHand[2].card;
        document.getElementById("c3").innerHTML = yourHand[3].card;
        document.getElementById("c4").innerHTML = yourHand[4].card;
        document.getElementById("c0").style.removeProperty('background-color');
        document.getElementById("c1").style.removeProperty('background-color');
        document.getElementById("c2").style.removeProperty('background-color');
        document.getElementById("c3").style.removeProperty('background-color');
        document.getElementById("c4").style.removeProperty('background-color');
    }
    function checkWin() {
        if (checkNum(2) !== null) {
            console.log("success")
        }
    }
    function checkNum(n) {

        const counts = yourHand.reduce((acc, obj) => {
            const val = obj["point"];
            acc[val] = (acc[val] || 0) + 1;
            return acc;
        }, {});

        return Object.entries(counts)
            .filter(([value, count]) => count === n)
            .map(([value]) => Number(value));
    }
    function reset() {
        window.location.reload();
    }


</script>
