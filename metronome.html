<!DOCTYPE html>
<html>
<header>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
</header>
<style>


</style>

<body>
    <h1>Metronome</h1>
    <label>BPM:</label> <br>
    <p id="displayBPM"></p>
    <button onClick="add1BPM()">+1</button>
    <button onClick="add10BPM()">+10</button>
    <input type="range" min="30" max="300" value="120" class="slider" id="BPM" onInput="updateBPM">
    <button onClick="sub1BPM()">-1</button>
    <button onClick="sub10BPM()">-10</button> <br> <br>
    <button onclick="startMetronome()">Start</button>
    <button onclick="stopMetronome()">Stop</button> <br> <br>
    <p>Select a time signature:</p>
    <select name="time" id="time">
        <option value="4">4/4</option>
        <option value="3">3/4</option>
        <option value="6">6/8</option>
        <option value="3">3/8</option>
    </select>
    <br> <br>
    <p>Mute random bars:</p>
    <input type="radio" name="muteFrequency" class="mute" id="0" value="0">
    <label for="0">Off</label>
    <input type="radio" name="muteFrequency" class="mute" id="10" value="10">
    <label for="10">10%</label>
    <input type="radio" name="muteFrequency" class="mute" id="20" value="20">
    <label for="20">20%</label>
    <input type="radio" name="muteFrequency" class="mute" id="30" value="30">
    <label for="30">30%</label>
    <input type="radio" name="muteFrequency" class="mute" id="40" value="40">
    <label for="40">40%</label>

</body>

<script>
    document.getElementById('0').checked = true;
    var slider = document.getElementById('BPM');
    let interval;
    let intervalTime = 60000 / slider.value;
    let beatInBar = 0;
    let mutedBar = false;
    const timeSignature = document.getElementById('time');
    document.getElementById('displayBPM').innerHTML = slider.value;
    slider.oninput = function () {
        document.getElementById('displayBPM').innerHTML = slider.value;
    }
    function add1BPM() {
        slider.value = +slider.value + 1;
        document.getElementById('displayBPM').innerHTML = slider.value;
    }
    function add10BPM() {
        slider.value = +slider.value + 10;
        document.getElementById('displayBPM').innerHTML = slider.value;
    }
    function sub1BPM() {
        slider.value -= 1;
        document.getElementById('displayBPM').innerHTML = slider.value;
    }
    function sub10BPM() {
        slider.value -= 10;
        document.getElementById('displayBPM').innerHTML = slider.value;
    }

    function startMetronome() {
        clearInterval(interval);
        intervalTime = 60000 / slider.value;
        beatInBar = 0;
        mutedBar = false;
        interval = setInterval(tick, intervalTime);
        tick();
    }

    function stopMetronome() {
        clearInterval(interval);
        interval = undefined;
    }

    function tick() {
        if (beatInBar === 0) {
            mutedBar = Math.random() * 100 < getMuteFrequency();
        }

        if (!mutedBar) {
            const audio = new Audio('tick.mp3');
            audio.play();
        }

        beatInBar = (beatInBar + 1) % Number(timeSignature.value);
    }

    function getMuteFrequency() {
        const selectedMute = document.querySelector('input[name="muteFrequency"]:checked');
        return Number(selectedMute.value);
    }

    timeSignature.onchange = function () {
        beatInBar = 0;
        mutedBar = false;
    };

    slider.oninput = function () {
        document.getElementById('displayBPM').innerHTML = slider.value;
        if (interval) {
            startMetronome();
        }
    };
</script>

</html>
